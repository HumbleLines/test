server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: trade-gateway-file
    static_configs:
      - targets: [localhost]
        labels:
          job: trade-gateway
          source: hostfile
          __path__: /host-logs/trade-gateway/app.json.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            caller: caller
            trace_id: trace_id
            span_id: span_id
            ts: "['@timestamp']"
      - labels:
          level:
          source:
          trace_id:
      - timestamp:
          source: ts
          format: RFC3339Nano
          fallback_formats: [RFC3339]
